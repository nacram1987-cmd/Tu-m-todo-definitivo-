# Configuración de Netlify para Tu Método Definitivo

[build]
  command = "echo 'Static site, no build needed'"
  publish = "."

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# Configuración de funciones
[[functions]]
  name = "guardar-datos"
  handler = "functions/guardar-datos.js"

[[functions]]
  name = "obtener-datos"
  handler = "functions/obtener-datos.js"

[[functions]]
  name = "listar-usuarios"
  handler = "functions/listar-usuarios.js"

# CORS headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Redirects para SPA
[[redirects]]
  from = "/*"
  to = "/index-fase3.html"
  status = 200
