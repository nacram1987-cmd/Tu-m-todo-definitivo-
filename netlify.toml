# Configuración de Netlify para Tu Método Definitivo

[build]
  command = "echo 'Static site, no build needed'"
  publish = "."

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# CORS headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Endpoints /api/* documentados en las funciones
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirects para SPA
[[redirects]]
  from = "/*"
  to = "/index-fase4.html"
  status = 200
