<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu Método Definitivo - Fase 4 Beta</title>
  
  <style>
    :root {
      --color-primary: #00d4aa;
      --color-secondary: #2d3748;
      --color-success: #48bb78;
      --color-warning: #ed8936;
      --color-danger: #f56565;
      --color-background: #1a202c;
      --color-surface: #2d3748;
      --color-text: #e2e8f0;
      --color-text-muted: #a0aec0;
      
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-size-base: 16px;
      --radius: 8px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      background: var(--color-background);
      color: var(--color-text);
      line-height: 1.6;
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .app-header {
      border-bottom: 2px solid var(--color-primary);
      margin-bottom: 40px;
      padding-bottom: 20px;
    }

    .app-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-warning));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-header .beta-badge {
      display: inline-block;
      background: var(--color-warning);
      color: var(--color-background);
      padding: 4px 12px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .app-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .nav-item {
      padding: 10px 20px;
      background: var(--color-surface);
      border: 1px solid var(--color-primary);
      color: var(--color-text);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s;
    }

    .nav-item:hover {
      background: var(--color-primary);
      color: var(--color-background);
    }

    .nav-item.activo {
      background: var(--color-primary);
      color: var(--color-background);
    }

    .dashboard-hero {
      background: linear-gradient(135deg, var(--color-secondary), #1a202c);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius);
      padding: 40px;
      margin-bottom: 40px;
      box-shadow: var(--shadow);
    }

    .hero-principal {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-etiqueta {
      font-size: 0.875rem;
      color: var(--color-primary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-valor {
      font-size: 3rem;
      font-weight: 700;
      margin: 15px 0;
      color: var(--color-primary);
    }

    .hero-valor.negativo {
      color: var(--color-danger);
    }

    .hero-subtitulo {
      color: var(--color-text-muted);
      font-size: 0.95rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .dashboard-card {
      background: var(--color-background);
      border: 1px solid var(--color-surface);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .card-icono {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .card-titulo {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .card-valor {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-primary);
    }

    .dashboard-alert {
      padding: 15px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .alert-defict {
      background: rgba(245, 101, 101, 0.2);
      border-left: 4px solid var(--color-danger);
      color: var(--color-danger);
    }

    .alert-riesgo {
      background: rgba(237, 137, 54, 0.2);
      border-left: 4px solid var(--color-warning);
      color: var(--color-warning);
    }

    .dashboard-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
      font-weight: 500;
    }

    .btn-primario {
      background: var(--color-primary);
      color: var(--color-background);
    }

    .btn-primario:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 212, 170, 0.3);
    }

    .btn-secundario {
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-primary);
    }

    .btn-secundario:hover {
      background: var(--color-primary);
      color: var(--color-background);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-contenido {
      background: var(--color-surface);
      border-radius: var(--radius);
      max-width: 500px;
      width: 90%;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--color-background);
    }

    .modal-header h2 {
      font-size: 1.5rem;
    }

    .modal-cerrar {
      background: none;
      border: none;
      color: var(--color-text);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 20px;
      border-top: 1px solid var(--color-background);
    }

    .btn-modal {
      flex: 1;
    }

    .form-grupo {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 15px;
    }

    .form-grupo label {
      font-weight: 500;
      color: var(--color-text);
    }

    .form-grupo input,
    .form-grupo textarea,
    .form-grupo select {
      padding: 10px;
      background: var(--color-background);
      border: 1px solid var(--color-surface);
      border-radius: var(--radius);
      color: var(--color-text);
      font-size: 0.95rem;
    }

    .form-grupo input:focus,
    .form-grupo textarea:focus,
    .form-grupo select:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 2000;
      animation: slideIn 0.3s ease;
    }

    .toast-exito {
      background: var(--color-success);
      color: white;
    }

    .toast-error {
      background: var(--color-danger);
      color: white;
    }

    .toast-info {
      background: var(--color-primary);
      color: var(--color-background);
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .app-footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid var(--color-surface);
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }

    .tabla-operaciones {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 20px;
    }

    .tabla-operaciones th {
      background: var(--color-background);
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: var(--color-primary);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .tabla-operaciones td {
      padding: 15px;
      border-top: 1px solid var(--color-background);
    }

    .tabla-operaciones tr:hover {
      background: rgba(0, 212, 170, 0.1);
    }

    .sin-datos {
      text-align: center;
      color: var(--color-text-muted);
      padding: 40px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--color-surface);
      padding: 15px;
      border-radius: var(--radius);
      border-left: 4px solid var(--color-primary);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .stat-valor {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Módulos en orden de carga -->
  <script src="motor-financiero.js"></script>
  <script src="datos-modelo.js"></script>
  <script src="almacenamiento.js"></script>
  <script src="ui-componentes.js"></script>
  <script src="app-fase4.js"></script>

  <script>
    console.log('🚀 TMD Fase 4 Beta - Iniciando...');
  </script>
</body>
</html>
